name: Build Jekyll Site

on:
  workflow_call:
    inputs:
      baseurl:
        required: false
        type: string
        default: ""
        description: "Base URL for Jekyll build"
      refresh_community_activity:
        required: false
        type: boolean
        default: false
        description: "Refresh public GitHub statistics before the production build"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test community activity collector
        run: python3 -m unittest discover -s tests -p 'test_community_activity.py' -v

      - name: Refresh community activity
        if: inputs.refresh_community_activity
        run: python3 scripts/update_community_activity.py --allow-stale
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate community activity snapshot
        run: python3 scripts/update_community_activity.py --check

      # IMPORTANT: If you change ruby-version here, update across all workflows
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ inputs.baseurl }}"
        env:
          JEKYLL_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site-${{ github.sha }}
          path: _site/
          retention-days: 1
