<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenQSE Meetings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: left;
            line-height: 1.5;
            margin: 50px auto;
            max-width: 1100px;
            padding: 0 20px;
        }

        a {
            overflow-wrap: anywhere;
        }

        .time-table {
            border-collapse: collapse;
            max-width: 760px;
            width: 100%;
        }

        .time-table th,
        .time-table td {
            text-align: left;
        }

        .meeting-list {
            border-collapse: separate;
            border-spacing: 0 14px;
            width: 100%;
        }

        .meeting-cell {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 18px;
        }

        .meeting-cell > :first-child {
            margin-top: 0;
        }

        .meeting-cell--shaded {
            background: #f1f5f9;
        }

        .meeting-cell--plain {
            background: #ffffff;
        }

        .slot-grid {
            border-collapse: separate;
            border-spacing: 12px 0;
            margin: 0 -12px;
            table-layout: fixed;
            width: calc(100% + 24px);
        }

        .slot-cell {
            padding: 0 12px;
        }

        @media (max-width: 800px) {
            .slot-grid,
            .slot-grid > tbody,
            .slot-grid > tbody > tr,
            .slot-grid > tbody > tr > .slot-cell {
                display: block;
                width: 100%;
            }

            .slot-grid {
                margin: 0;
            }

            .slot-cell {
                box-sizing: border-box;
                margin-bottom: 12px;
                padding: 0;
            }
        }
    </style>
</head>
